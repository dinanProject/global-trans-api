---
deployment:
  tasks:
    - export DEPLOYPATH=/DATA/u3868672/global-trans-api
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/tmp"
    - /bin/rm -rf "$DEPLOYPATH/src"
    - /bin/cp -R src "$DEPLOYPATH/src"
    - /bin/cp app.js "$DEPLOYPATH/app.js"
    - /bin/cp config.js "$DEPLOYPATH/config.js"
    - /bin/cp package.json "$DEPLOYPATH/package.json"
    - /bin/cp package-lock.json "$DEPLOYPATH/package-lock.json"
    - /bin/touch "$DEPLOYPATH/tmp/restart.txt"